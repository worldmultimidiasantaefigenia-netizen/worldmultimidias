<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Multimídias - Som e Iluminação</title>
  <style>
    /* Paleta de cores */
    :root {
      --laranja: #FF6A00;
      --vermelho-escuro: #C1272D;
      --azul-petroleo: #000000;
      --grafite: #1C1C1C;
      --cinza-claro: #F2F2F2;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--grafite);
      color: var(--cinza-claro);
    }

    header {
      background-color: var(--azul-petroleo);
      padding: 20px;
      text-align: center;
    }

    header img {
      max-width: 220px;
      height: auto;
    }

    .hero {
      background: radial-gradient(circle at center, var(--laranja), var(--vermelho-escuro));
      color: white;
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto;
    }

    .cta {
      background-color: var(--laranja);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1em;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .cta:hover {
      background-color: var(--vermelho-escuro);
    }

    footer {
      background-color: var(--azul-petroleo);
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <!-- Substitua o caminho abaixo pelo seu logo -->
    <img src="C:\Users\welli\OneDrive\Área de Trabalho\projeto Jeff\img\logo-world-multimidias.jpg.png" alt="World Multimídias Logo">
  </header>

  <section class="hero">
    <h1>Som e Iluminação Profissional</h1>
    <p>Transforme seus eventos em experiências inesquecíveis com tecnologia, criatividade e confiança.</p>
    <button class="cta">Solicitar Orçamento</button>
  </section>

  <footer>
    © 2026 World Multimídias — Todos os direitos reservados
  </footer>

</body>
</html>
